name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

permissions:
  contents: write

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak depoyu kontrol et
        uses: actions/checkout@v4
        with:
          ref: master
          path: src
          fetch-depth: 1

      - name: Builds dalını kontrol et
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Eski derlemeleri temizle
        run: rm -f "$GITHUB_WORKSPACE/builds"/*.cs3 "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: JDK 17 ayarla
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK ayarla
        uses: android-actions/setup-android@v3

      - name: Gradle kurulumu
        uses: gradle/actions/setup-gradle@v4

      - name: Eklentileri derle
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-daemon

      - name: Derlemeleri builds dalına kopyala
        run: |
          find "$GITHUB_WORKSPACE/src" -type f -name '*.cs3' -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          cp "$GITHUB_WORKSPACE/src/build/plugins.json" "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: repo.json adresini ayarla
        run: |
          if [ -f "$GITHUB_WORKSPACE/builds/repo.json" ]; then
            sed -i 's/@KekikAkademi/@liberta09/g' "$GITHUB_WORKSPACE/builds/repo.json"
          fi

      - name: Derlemeleri GitHub'a gönder
        working-directory: builds
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "Build ${{ github.sha }}" || echo "Değişiklik yok"
          git push origin builds

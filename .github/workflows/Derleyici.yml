name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

permissions:
  contents: write

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu kontrol et
        uses: actions/checkout@v6
        with:
          ref: master
          path: src
          fetch-depth: 1

      - name: Builds dalını kontrol et
        uses: actions/checkout@v6
        with:
          ref: builds
          path: builds
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Eski derlemeleri temizle
        run: rm -f "$GITHUB_WORKSPACE/builds"/*.cs3 "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: JDK 17 ayarla
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle kurulumunu yap
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Eklentileri derle
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Derlemeleri builds dalına kopyala
        run: |
          find "$GITHUB_WORKSPACE/src" -type f -name '*.cs3' -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          cp "$GITHUB_WORKSPACE/src/build/plugins.json" "$GITHUB_WORKSPACE/builds/plugins.json"
          if command -v jq >/dev/null 2>&1; then
            jq 'map(select(.internalName != "AltiYuzAltmisAltiFilmIzle" and .name != "AltiYuzAltmisAltiFilmIzle"))' "$GITHUB_WORKSPACE/builds/plugins.json" > "$GITHUB_WORKSPACE/builds/plugins.json.tmp"
            mv "$GITHUB_WORKSPACE/builds/plugins.json.tmp" "$GITHUB_WORKSPACE/builds/plugins.json"
          fi
          if [ -f "$GITHUB_WORKSPACE/builds/repo.json" ]; then
            sed -i 's#https://raw.githubusercontent.com/feroxx/Kekik-cloudstream/builds/plugins.json#https://raw.githubusercontent.com/liberta09/Kekik-cloudstream/builds/plugins.json#g' "$GITHUB_WORKSPACE/builds/repo.json"
            sed -i 's/@KekikAkademi/@liberta09/g' "$GITHUB_WORKSPACE/builds/repo.json"
          fi

      - name: Derlemeleri builds dalına gönder
        working-directory: builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git diff --cached --quiet && echo "Değişiklik yok" && exit 0
          git commit -m "Build ${{ github.sha }}"
          git push origin HEAD:builds

# Build workflow trigger: 2026-08-28
name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu kontrol et
        uses: actions/checkout@v6
        with:
          ref: master
          path: src
          fetch-depth: 1

      - name: Builds dalını kontrol et
        uses: actions/checkout@v6
        with:
          ref: builds
          path: builds
          fetch-depth: 0
          persist-credentials: false

      - name: Eski derlemeleri temizle
        run: rm -f "$GITHUB_WORKSPACE/builds"/*.cs3 "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: JDK 17 ayarla
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle kurulumunu yap
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: DiziGom nullability düzeltmesi
        working-directory: src
        run: |
          sed -i 's/\.filter { it\.isNotBlank() }/.filterNotNull().filter { it.isNotBlank() }/' DiziGom/src/main/kotlin/com/nikyokki/DiziGom.kt

      - name: HintFilmIzle trailer filtreleme
        working-directory: src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('HintFilmIzle/src/main/kotlin/com/liberta09/HintFilmIzle.kt')
          s = p.read_text(encoding='utf-8')
          marker = '    private fun collectCandidateUrls'
          start = s.index(marker)
          replacement = '''    private fun isTrailerHost(url: String): Boolean {
          val lower = url.lowercase()
          return lower.contains("youtube.com") || lower.contains("youtu.be") || lower.contains("vimeo.com") ||
              lower.contains("facebook.com") || lower.contains("twitter.com")
      }

      private fun collectCandidateUrls(document: org.jsoup.nodes.Document): List<String> {
          val candidates = linkedSetOf<String>()
          val attributes = listOf(
              "src", "href", "data-src", "data-url", "data-link", "data-iframe", "data-video",
              "data-embed", "data-player", "data-content", "data-href", "data-lazy-src"
          )
          document.select("a, button, [role=button], [onclick], iframe, video, source, embed, object")
              .filter { element ->
                  val marker = listOf(
                      element.text(), element.attr("class"), element.attr("id"),
                      element.attr("data-player"), element.attr("data-embed"), element.attr("data-video")
                  ).joinToString(" ").lowercase()
                  element.tagName() in setOf("iframe", "video", "source", "embed", "object") ||
                      marker.contains("tekpart") || marker.contains("player") || marker.contains("embed") ||
                      marker.contains("part") || marker.contains("video")
              }
              .forEach { element ->
                  attributes.forEach { attribute ->
                      val fixed = fixUrlNull(element.attr(attribute).trim())
                      if (fixed != null && !isTrailerHost(fixed)) candidates += fixed
                  }
                  val onclick = element.attr("onclick")
                  Regex("https?://[^\\\"'()\\s<>]+", RegexOption.IGNORE_CASE).findAll(onclick).forEach { match ->
                      val fixed = fixUrlNull(match.value)
                      if (fixed != null && !isTrailerHost(fixed)) candidates += fixed
                  }
              }
          document.select("script").filter { script ->
              script.data().contains(Regex("tekpart|player|embed|m3u8|mp4", RegexOption.IGNORE_CASE))
          }.forEach { script ->
              Regex("https?://[^\\\"'\\s<>]+", RegexOption.IGNORE_CASE).findAll(script.data()).forEach { match ->
                  val fixed = fixUrlNull(match.value)
                  if (fixed != null && !isTrailerHost(fixed)) candidates += fixed
              }
          }
          return candidates.toList()
      }

      private suspend fun tryExtractor(
          url: String,
          referer: String,
          subtitleCallback: (SubtitleFile) -> Unit,
          callback: (ExtractorLink) -> Unit
      ): Boolean {
          var found = false
          runCatching {
              loadExtractor(url, referer, subtitleCallback, callback)
              found = true
          }
          runCatching {
              val child = app.get(url, referer = referer).document
              collectCandidateUrls(child).forEach { nested ->
                  runCatching {
                      loadExtractor(nested, url, subtitleCallback, callback)
                      found = true
                  }
              }
          }
          return found
      }

      override suspend fun loadLinks(
          data: String,
          isCasting: Boolean,
          subtitleCallback: (SubtitleFile) -> Unit,
          callback: (ExtractorLink) -> Unit
      ): Boolean {
          val document = runCatching { app.get(data).document }.getOrNull() ?: return false
          var found = false
          collectCandidateUrls(document).forEach { candidate ->
              if (tryExtractor(candidate, data, subtitleCallback, callback)) found = true
          }
          return found
      }
'''
          p.write_text(s[:start] + replacement + '\n}\n', encoding='utf-8')
          PY

      - name: Eklentileri derle
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Derlemeleri builds dalına kopyala
        run: |
          find "$GITHUB_WORKSPACE/src" -type f -name '*.cs3' -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          cp "$GITHUB_WORKSPACE/src/build/plugins.json" "$GITHUB_WORKSPACE/builds/plugins.json"
          if command -v jq >/dev/null 2>&1; then
            jq 'map(select(.internalName != "AltiYuzAltmisAltiFilmIzle" and .name != "AltiYuzAltmisAltiFilmIzle"))' "$GITHUB_WORKSPACE/builds/plugins.json" > "$GITHUB_WORKSPACE/builds/plugins.json.tmp"
            mv "$GITHUB_WORKSPACE/builds/plugins.json.tmp" "$GITHUB_WORKSPACE/builds/plugins.json"
          fi
          if [ -f "$GITHUB_WORKSPACE/builds/repo.json" ]; then
            sed -i 's#https://raw.githubusercontent.com/feroxx/Kekik-cloudstream/builds/plugins.json#https://raw.githubusercontent.com/liberta09/Kekik-cloudstream/builds/plugins.json#g' "$GITHUB_WORKSPACE/builds/repo.json"
            sed -i 's/@KekikAkademi/@liberta09/g' "$GITHUB_WORKSPACE/builds/repo.json"
          fi

      - name: Derlemeleri builds dalına gönder
        working-directory: builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git diff --cached --quiet && echo "Değişiklik yok" && exit 0
          git commit -m "Build ${{ github.sha }}"
          git push origin HEAD:builds

version: 2
updates:
  # Gradle bağımlılıkları otomatik güncellemeleri
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "csprofesor"
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "chore(deps):"
      prefix-scope: "gradle"
      include: "scope"

  # GitHub Actions otomatik güncellemeleri
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 3
    reviewers:
      - "csprofesor"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci:"
      prefix-scope: "actions"
